<html lang="zh-CN"><head><meta charset="utf-8"><style>
body { font: 14px -apple-system, sans-serif; color: #222; line-height: 1.7; padding: 12px; }

<h1>欢迎安装右键助手 @VERSION@</h1>
<p>为访达和桌面的右键菜单增加新建文件、常用目录、文件操作和文件图标等功能。</p>
<p>支持 macOS @MINIMUM_OS@ 及以上版本，同时支持 Apple 芯片和 Intel Mac。</p>
<p>安装程序会将“右键助手”放入“应用程序”文件夹。使用本安装包无需安装 Python、Xcode 或其他开发工具。</p>
<p><strong>安装完成后会自动打开右键助手；如果扩展未启用，会弹出引导，带你进入 Finder 扩展设置。启用后右键菜单才会生效。</strong></p>
</body></html>
