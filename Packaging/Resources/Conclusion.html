<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
body { font: 14px -apple-system, sans-serif; color: #222; line-height: 1.7; padding: 12px; }
h1 { font-size: 24px; }
</style></head><body>
<h1>右键助手已安装</h1>
<ol>
<li>安装完成后会自动打开“右键助手”；如未打开，请从“应用程序”手动打开。</li>
<li>进入“通用设置”，打开 Finder 扩展设置。</li>
<li>启用“右键助手”，再到访达或桌面右键使用。</li>
</ol>
<p><strong>如果右键只有“用 ChatGPT 打开”，表示系统服务已注册；仍需完成上面的 Finder 扩展启用步骤。</strong></p>
<p>如菜单未出现，请关闭并重新打开访达窗口，确认扩展已启用。升级后如界面仍显示旧版本，请退出应用后重新打开。</p>
</body></html>
